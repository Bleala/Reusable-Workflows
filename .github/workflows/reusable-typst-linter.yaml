---
name: Reusable - Lint Typst Files 📑🔍
run-name: Lint Typst Files 📑🔍

on:
  workflow_call:
    inputs:
      check_format:
        description: 'Check formatting with typstyle (fails on unformatted files)'
        required: false
        default: false
        type: boolean
      fail_on_warnings:
        description: 'Treat Typst compiler warnings as errors'
        required: false
        default: true
        type: boolean
      files:
        description: 'Glob expression(s) of Typst entry files to compile'
        required: false
        default: '**/main.typ'
        type: string
      font_paths:
        description: 'Font directories passed to typst via --font-path'
        required: false
        default: ''
        type: string
      format_line_width:
        description: 'Maximum line width for typstyle (--line-width), empty = typstyle default (80)'
        required: false
        default: ''
        type: string
      format_paths:
        description: 'Files, directories or glob expressions checked by typstyle'
        required: false
        default: '.'
        type: string
      lfs:
        description: 'Pull only the Git LFS files the documents need (detected via typst --deps, plus font_paths)'
        required: false
        default: true
        type: boolean
      pdf_standard:
        description: 'PDF standard(s) passed to typst via --pdf-standard (e.g. a-2b), some errors only show with it'
        required: false
        default: ''
        type: string
      ref:
        description: 'Ref to checkout'
        required: true
        type: string
      root:
        description: 'Project root passed to typst via --root'
        required: false
        default: '.'
        type: string
      separator:
        description: 'String to use as a separator for the list inputs'
        required: false
        default: ','
        type: string
      typst_version:
        description: 'Typst version (SemVer range or latest)'
        required: false
        default: 'latest'
        type: string
      typstyle_sha256:
        description: 'SHA256 of the typstyle x86_64-unknown-linux-gnu binary, must match typstyle_version (empty = no check)'
        required: false
        default: 'ea790059cd05016a6f4282386ab7b4fc92f83faa0f5126d8216df2562d7596fd'
        type: string
      typstyle_version:
        description: 'typstyle version, only used if check_format is true'
        required: false
        default: '0.15.2'
        type: string
      warn_pattern:
        description: 'Extended regex reported as warning annotation in *.typ files (e.g. #todo\[), does not fail the job'
        required: false
        default: ''
        type: string
    secrets:
      GITHUB_WORKFLOW_TOKEN:
        description: 'The GITHUB_TOKEN for authentication.'
        required: true

jobs:
  lint-typst-files:
    name: Lint Typst Files 📑🔍
    runs-on: ubuntu-latest
    # A document stuck in an endless loop must not burn the default 6 hours
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    permissions:
      # for actions/checkout to fetch code
      contents: read
    steps:
      # Shared shell functions, every following run step sources this file
      - name: Prepare Helper Functions 🧰
        id: helpers
        run: |
          cat > "$RUNNER_TEMP/typst-lint-lib.sh" <<'EOF'
          # Literal "&" in ${var//pattern/replacement} (bash 5.2 would insert the match).
          shopt -u patsub_replacement 2>/dev/null || true

          # Split a list input at $SEPARATOR, trim whitespace, drop empty items (one item per line).
          split() {
            local item
            while IFS= read -r item; do
              item="${item#"${item%%[![:space:]]*}"}"
              item="${item%"${item##*[![:space:]]}"}"
              if [ -n "$item" ]; then printf '%s\n' "$item"; fi
            done <<< "${1//"$SEPARATOR"/$'\n'}"
          }

          # Expand a list of glob expressions (split by $SEPARATOR), print each match once, NUL-separated.
          # A literal path without wildcard is kept even if missing, the calling tool reports it.
          expand_globs() {
            local glob match
            local -a globs matches
            local -A seen=()
            shopt -s globstar nullglob
            mapfile -t globs < <(split "$1")
            for glob in "${globs[@]}"; do
              # Glob must expand here, so no quotes. Empty IFS keeps paths with spaces intact.
              IFS=
              # shellcheck disable=SC2206
              matches=($glob)
              unset IFS
              for match in "${matches[@]}"; do
                if [ -z "${seen[$match]:-}" ]; then
                  seen[$match]=1
                  printf '%s\0' "$match"
                fi
              done
            done
          }

          # Escape values for workflow commands: data after "::", properties also ":" and ",".
          esc_data() {
            local v="${1//%/%25}"
            v="${v//$'\r'/%0D}"
            printf '%s' "${v//$'\n'/%0A}"
          }
          esc_prop() {
            local v
            v="$(esc_data "$1")"
            v="${v//:/%3A}"
            printf '%s' "${v//,/%2C}"
          }

          # Escape text for a Markdown table cell in the job summary.
          md_cell() {
            local v="${1//|/\\|}"
            v="${v//</&lt;}"
            v="${v//$'\r'/}"
            printf '%s' "${v//$'\n'/ }"
          }

          # Location as Markdown link to file and line at the checked out commit,
          # plain text for paths outside the repository (e.g. Typst packages).
          md_location() {
            local file="$1" line="${2:-}" label url path
            label="$(md_cell "$file")"
            if [ -n "$line" ]; then label="${label}:${line}"; fi
            if [[ $file == /* || ! -e $file ]]; then
              printf '%s' "$label"
              return
            fi
            path="${file//%/%25}"
            path="${path// /%20}"
            path="${path//#/%23}"
            path="${path//\?/%3F}"
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/$(git rev-parse HEAD)/${path}"
            if [ -n "$line" ]; then url="${url}#L${line}"; fi
            printf '[%s](%s)' "$label" "$url"
          }

          # Write a findings table to the job summary, at most 200 rows.
          # $1 = table header row, following arguments = table rows.
          summary_table() {
            local header="$1" columns max=200
            shift
            if [ $# -eq 0 ]; then return; fi
            columns="${header//[^|]/}"
            {
              echo ""
              echo "$header"
              printf '%s\n' "${columns//|/| --- }" | sed 's/ --- $//'
              printf '%s\n' "${@:1:$max}"
              if [ $# -gt "$max" ]; then
                echo ""
                echo "_$(( $# - max )) more, see the log._"
              fi
              if [ $# -gt 10 ]; then
                echo ""
                echo "_GitHub shows at most 10 annotations per type and step, this table lists all of them._"
              fi
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          }
          EOF

      # https://github.com/marketplace/actions/checkout
      - name: Check Out Repository Code 🛒
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          token: ${{ secrets.GITHUB_WORKFLOW_TOKEN }}

      # https://github.com/marketplace/actions/setup-typst
      - name: Set Up Typst 📑🛠️
        id: setup-typst
        uses: typst-community/setup-typst@6a2cfaf0b28d636b00148f965e315bae81079aaa # v5.3.1
        with:
          typst-version: ${{ inputs.typst_version }}

      # Expand the globs once, the list is used by the LFS and the lint step
      - name: Collect Typst Files 📑📋
        id: collect-files
        env:
          SEPARATOR: ${{ inputs.separator }}
          TYPST_FILES: ${{ inputs.files }}
        run: |
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/typst-lint-lib.sh"

          mapfile -d '' -t files < <(expand_globs "$TYPST_FILES")
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No Typst files match: $(esc_data "$TYPST_FILES")"
            exit 1
          fi

          printf '%s\0' "${files[@]}" > "$RUNNER_TEMP/typst-files"
          printf 'Typst file: %s\n' "${files[@]}"

      # Pull only the LFS objects the documents read (images, data) and the fonts, not every binary in the repo
      - name: Pull Git LFS Files 📦⬇️
        id: lfs-pull
        if: ${{ inputs.lfs }}
        env:
          FONT_PATHS: ${{ inputs.font_paths }}
          ROOT: ${{ inputs.root }}
          SEPARATOR: ${{ inputs.separator }}
          TOKEN: ${{ secrets.GITHUB_WORKFLOW_TOKEN }}
        run: |
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/typst-lint-lib.sh"

          # Detection relies on typst compile --deps, fail clearly instead of silently pulling nothing.
          help="$(typst compile --help)"
          if [[ $help != *"--deps "* ]]; then
            echo "::error::This Typst version has no 'typst compile --deps', use a newer typst_version or set lfs: false"
            exit 1
          fi

          mapfile -t lfs_files < <(git lfs ls-files -n)
          if [ ${#lfs_files[@]} -eq 0 ]; then
            echo "No Git LFS files in repository, nothing to pull"
            exit 0
          fi
          declare -A is_lfs=()
          for f in "${lfs_files[@]}"; do is_lfs[$f]=1; done
          declare -A pulled=()

          # Header only for the GitHub host, not for the LFS storage the objects are redirected to.
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          lfs_pull() {
            local include
            include="$(IFS=,; echo "$*")"
            printf 'Pull: %s\n' "$@"
            git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" \
              lfs pull --include="$include"
            for f in "$@"; do pulled[$f]=1; done
          }

          # Fonts: typst does not list them as dependencies, so pull the font directories.
          font_args=()
          wanted=()
          mapfile -t font_dirs < <(split "$FONT_PATHS")
          for dir in "${font_dirs[@]}"; do
            font_args+=(--font-path "$dir")
            dir="${dir#./}"
            dir="${dir%/}"
            for f in "${lfs_files[@]}"; do
              if [[ $f == "$dir"/* ]]; then wanted+=("$f"); fi
            done
          done
          if [ ${#wanted[@]} -gt 0 ]; then lfs_pull "${wanted[@]}"; fi

          # Dependencies: typst writes them even if compiling fails on an LFS pointer,
          # repeat in case a pulled file (e.g. read() data) pulls in further files.
          mapfile -d '' -t files < "$RUNNER_TEMP/typst-files"
          for round in 1 2 3 4 5; do
            wanted=()
            for file in "${files[@]}"; do
              typst compile --root "$ROOT" "${font_args[@]}" --deps "$RUNNER_TEMP/deps" \
                --deps-format zero "$file" "$RUNNER_TEMP/lfs.pdf" > /dev/null 2>&1 || true
              [ -f "$RUNNER_TEMP/deps" ] || continue
              mapfile -d '' -t deps < "$RUNNER_TEMP/deps"
              rm -f "$RUNNER_TEMP/deps"
              for dep in "${deps[@]}"; do
                dep="${dep#./}"
                if [ -n "${is_lfs[$dep]:-}" ] && [ -z "${pulled[$dep]:-}" ]; then
                  wanted+=("$dep")
                  pulled[$dep]=1
                fi
              done
            done
            if [ ${#wanted[@]} -eq 0 ]; then break; fi
            echo "Round ${round}: ${#wanted[@]} LFS file(s) needed"
            lfs_pull "${wanted[@]}"
          done

          echo "Pulled ${#pulled[@]} of ${#lfs_files[@]} LFS file(s)"
          {
            echo ""
            echo "Git LFS: pulled ${#pulled[@]} of ${#lfs_files[@]} file(s)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # Compile every entry file, turn diagnostics into GitHub annotations
      - name: Lint Typst Files 📑🔍
        id: typst-linter
        env:
          FAIL_ON_WARNINGS: ${{ inputs.fail_on_warnings }}
          FONT_PATHS: ${{ inputs.font_paths }}
          PDF_STANDARD: ${{ inputs.pdf_standard }}
          ROOT: ${{ inputs.root }}
          SEPARATOR: ${{ inputs.separator }}
        run: |
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/typst-lint-lib.sh"
          typst --version

          font_args=()
          mapfile -t font_dirs < <(split "$FONT_PATHS")
          for dir in "${font_dirs[@]}"; do
            font_args+=(--font-path "$dir")
          done
          standard_args=()
          if [ -n "$PDF_STANDARD" ]; then
            standard_args=(--pdf-standard "$PDF_STANDARD")
          fi

          mapfile -d '' -t files < "$RUNNER_TEMP/typst-files"

          # Raw compiler output contains repository content, it must not run as workflow commands.
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"

          failed=0
          errors=0
          warnings=0
          findings=()
          # With location: path:line:col: level: message, without location: level: message.
          # The path may contain ":" itself, backtracking finds the last ":line:col: ".
          regex='^((.+):([0-9]+):([0-9]+): )?(error|warning): (.*)$'

          for file in "${files[@]}"; do
            echo "::group::$(esc_data "$file")"
            output="$(typst compile --root "$ROOT" "${font_args[@]}" "${standard_args[@]}" \
              --diagnostic-format short "$file" "$RUNNER_TEMP/lint.pdf" 2>&1)" || failed=$((failed + 1))

            if [ -n "$output" ]; then
              echo "::stop-commands::${stop_token}"
              printf '%s\n' "$output"
              echo "::${stop_token}::"
            fi

            annotations=()
            while IFS= read -r line; do
              if [[ $line =~ $regex ]]; then
                level="${BASH_REMATCH[5]}"
                message="${BASH_REMATCH[6]}"
                if [ "$level" = "warning" ]; then
                  warnings=$((warnings + 1))
                else
                  errors=$((errors + 1))
                fi
                if [ -n "${BASH_REMATCH[1]}" ]; then
                  annotations+=("::${level} file=$(esc_prop "${BASH_REMATCH[2]}"),line=${BASH_REMATCH[3]},col=${BASH_REMATCH[4]}::$(esc_data "$message")")
                  location="$(md_location "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")"
                else
                  annotations+=("::${level} title=$(esc_prop "$file")::$(esc_data "$message")")
                  location="$(md_location "$file")"
                fi
                findings+=("| ${level} | ${location} | $(md_cell "$message") |")
              fi
            done <<< "$output"
            if [ ${#annotations[@]} -gt 0 ]; then
              printf '%s\n' "${annotations[@]}"
            fi
            echo "::endgroup::"
          done

          {
            echo ""
            echo "### Typst Lint 📑"
            echo ""
            echo "| Files | Failed | Errors | Warnings |"
            echo "| --- | --- | --- | --- |"
            echo "| ${#files[@]} | ${failed} | ${errors} | ${warnings} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          summary_table "| Level | Location | Message |" "${findings[@]}"

          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} file(s) failed to compile"
            exit 1
          fi
          if [ "$FAIL_ON_WARNINGS" = "true" ] && [ "$warnings" -gt 0 ]; then
            echo "::error::${warnings} warning(s), fail_on_warnings is enabled"
            exit 1
          fi

      # Report matches (e.g. open #todo) as annotations only
      - name: Check Warn Patterns 🔎📝
        id: warn-pattern
        if: ${{ !cancelled() && steps.helpers.outcome == 'success' && steps.checkout.outcome == 'success' && inputs.warn_pattern != '' }}
        env:
          WARN_PATTERN: ${{ inputs.warn_pattern }}
        run: |
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/typst-lint-lib.sh"

          # Grep exits 1 for "no match" and 2 for an invalid regex.
          rc=0
          grep -qE -- "$WARN_PATTERN" /dev/null || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::Invalid warn_pattern: $(esc_data "$WARN_PATTERN")"
            exit 1
          fi

          matches=()
          while IFS=: read -r file line text; do
            echo "::warning file=$(esc_prop "$file"),line=${line}::Pattern match: $(esc_data "$text")"
            matches+=("| $(md_location "$file" "$line") | $(md_cell "${text:0:200}") |")
          done < <(git ls-files -z '*.typ' | xargs -0 -r grep -nE -- "$WARN_PATTERN" /dev/null || true)
          echo "${#matches[@]} match(es) for pattern: $WARN_PATTERN"
          {
            echo ""
            echo "### Warn Pattern 🔎"
            echo ""
            echo "\`$(md_cell "$WARN_PATTERN")\`: ${#matches[@]} match(es)"
          } >> "$GITHUB_STEP_SUMMARY"
          summary_table "| Location | Text |" "${matches[@]}"

      # Own download instead of typstyle-rs/typstyle-action: that one builds a Docker image on every run,
      # pins an older typstyle inside its Dockerfile and passes only a single option and path.
      # https://github.com/typstyle-rs/typstyle
      - name: Install Typstyle 📦🛠️
        id: install-typstyle
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && inputs.check_format }}
        env:
          TYPSTYLE_SHA256: ${{ inputs.typstyle_sha256 }}
          TYPSTYLE_VERSION: ${{ inputs.typstyle_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/typstyle" \
            "https://github.com/typstyle-rs/typstyle/releases/download/v${TYPSTYLE_VERSION}/typstyle-x86_64-unknown-linux-gnu"
          if [ -n "$TYPSTYLE_SHA256" ]; then
            echo "${TYPSTYLE_SHA256}  $RUNNER_TEMP/bin/typstyle" | sha256sum -c -
          fi
          chmod +x "$RUNNER_TEMP/bin/typstyle"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Check formatting of Typst files with typstyle, show the diff of every file that is not formatted
      - name: Check Typst Formatting 🎨🔍
        id: typstyle-check
        if: ${{ !cancelled() && steps.helpers.outcome == 'success' && steps.install-typstyle.outcome == 'success' }}
        env:
          FORMAT_LINE_WIDTH: ${{ inputs.format_line_width }}
          FORMAT_PATHS: ${{ inputs.format_paths }}
          SEPARATOR: ${{ inputs.separator }}
        run: |
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/typst-lint-lib.sh"
          typstyle --version

          mapfile -d '' -t paths < <(expand_globs "$FORMAT_PATHS")
          if [ ${#paths[@]} -eq 0 ]; then
            echo "::error::No files match format_paths: $(esc_data "$FORMAT_PATHS")"
            exit 1
          fi
          printf 'Format check: %s\n' "${paths[@]}"

          args=(--diff)
          if [ -n "$FORMAT_LINE_WIDTH" ]; then
            args+=(--line-width "$FORMAT_LINE_WIDTH")
          fi

          rc=0
          output="$(typstyle "${args[@]}" "${paths[@]}" 2>&1)" || rc=$?

          # The diff contains repository content, it must not run as workflow commands.
          if [ -n "$output" ]; then
            stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            echo "::stop-commands::${stop_token}"
            printf '%s\n' "$output"
            echo "::${stop_token}::"
          fi

          # One annotation and table row per block of changed lines, at its line in the original file.
          # A file starts with "--- file" directly followed by "+++ file" (a removed line "-- …" alone
          # must not count), a hunk with "@@ -line,…"; context lines (" ") move the line counter and
          # end a block, removed lines ("-") move it too, added lines ("+") do not. An empty line ends
          # the diff of a file (empty context lines are " "), so the next "--- file" is never a change.
          changes=()
          file=""
          previous=""
          old_line=0
          in_change=0
          while IFS= read -r line; do
            if [ -z "$line" ]; then
              file=""
              in_change=0
            elif [[ $previous == "--- "* && $line == "+++ ${previous#--- }" ]]; then
              file="${previous#--- }"
              in_change=0
            elif [[ -n $file && $line =~ ^@@\ -([0-9]+) ]]; then
              old_line="${BASH_REMATCH[1]}"
              in_change=0
            elif [[ -n $file && ( $line == "-"* || $line == "+"* ) ]]; then
              if [ "$in_change" -eq 0 ]; then
                in_change=1
                echo "::error file=$(esc_prop "$file"),line=${old_line}::Not formatted with typstyle, see the diff in the log"
                changes+=("| $(md_location "$file" "$old_line") |")
              fi
              if [[ $line == "-"* ]]; then old_line=$((old_line + 1)); fi
            elif [[ -n $file && $line == " "* ]]; then
              old_line=$((old_line + 1))
              in_change=0
            fi
            previous="$line"
          done <<< "$output"

          {
            echo ""
            echo "### Typst Formatting 🎨"
            echo ""
            echo "typstyle on ${#paths[@]} path(s): ${#changes[@]} unformatted section(s)"
          } >> "$GITHUB_STEP_SUMMARY"
          summary_table "| Location |" "${changes[@]}"

          if [ "$rc" -ne 0 ]; then
            fix=(typstyle -i "${args[@]:1}" "<files>")
            echo "::error::Typst files are not formatted, run: ${fix[*]}"
            exit 1
          fi
