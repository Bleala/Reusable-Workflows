---
name: Reusable - Lint Dockerfile 🐳📄🔍
run-name: Lint Dockerfile 🐳📄🔍

on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Path to the Dockerfile to lint'
        required: false
        default: './docker/Dockerfile'
        type: string
      ignore:
        description: 'Comma separated list of Hadolint rules to ignore'
        required: false
        default: ''
        type: string
      ref:
        description: 'Ref to checkout'
        required: true
        type: string
    secrets:
      GITHUB_WORKFLOW_TOKEN:
        description: 'The GITHUB_TOKEN for authentication.'
        required: true

jobs:
  lint-dockerfile:
    name: Lint Dockerfile 🐳📄🔍
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      # for actions/checkout to fetch code
      contents: read
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Check Out Repository Code 🛒
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          token: ${{ secrets.GITHUB_WORKFLOW_TOKEN }}

      # https://github.com/marketplace/actions/hadolint-action
      - name: Lint Dockerfile 🐳📄🔍
        id: dockerfile-linter
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          ignore: ${{ inputs.ignore }}
