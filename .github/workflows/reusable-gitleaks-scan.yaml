---
name: Reusable - Gitleaks Scan 🔑🔍
run-name: Gitleaks Scan 🔑🔍

on:
  workflow_call:
    inputs:
      ref:
        description: 'Specify the branch/tag to checkout (default: main)'
        required: false
        default: 'main'
        type: string
    secrets:
      GITHUB_WORKFLOW_TOKEN:
        description: 'The GITHUB_TOKEN for authentication.'
        required: true

jobs:
  gitleaks-scan:
    name: Gitleaks Scan 🔑🔍
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      # for actions to fetch code
      contents: read
      # for PR comments
      pull-requests: write
      # for artifacts upload
      security-events: write
      # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
      actions: read
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Check Out Repository Code 🛒
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # fetch all history
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_WORKFLOW_TOKEN }}

      # https://github.com/marketplace/actions/gitleaks
      - name: Scan Git Repository For Secrets 🔑🔍
        id: gitleaks-scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_WORKFLOW_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: "@Bleala"
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

      # Change tool name from 'gitleaks' to 'Gitleaks'
      - name: Capitalize Gitleaks Tool Name in SARIF Report
        id: capitalize-tool-name
        if: always()
        run: |
          sed -i 's/"name": "gitleaks"/"name": "Gitleaks"/' results.sarif

      # https://github.com/github/codeql-action
      # https://github.com/github/codeql-action/blob/main/upload-sarif/action.yml
      - name: Upload Gitleaks Scan Results To GitHub Security Tab 🛡️⬆️
        id: upload-gitleaks-results
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: always()
        with:
          sarif_file: results.sarif
          token: ${{ secrets.GITHUB_WORKFLOW_TOKEN }}
